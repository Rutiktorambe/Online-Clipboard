{% include 'navbar.html' %}
<body
  class="bg-gray-100 dark:bg-gray-900 flex flex-col justify-center items-center min-h-screen mt-16"
>
  <div
    class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md mt-10"
  >
    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-4">
      Paste Your Text
    </h2>

    <textarea
      id="clipboardText"
      class="w-full p-3 border rounded-lg bg-gray-100 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500"
      rows="5"
      placeholder="Enter your text here..."
    ></textarea>

    <button
      onclick="saveClipboard()"
      class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition-all duration-300"
    >
      Save
    </button>

    <p
      id="result"
      class="mt-4 text-green-600 font-semibold opacity-0 transition-opacity duration-300"
    ></p>
  </div>

  {% include 'footer.html' %}

  <script>
    async function saveClipboard() {
      const content = document.getElementById("clipboardText").value;
      const result = document.getElementById("result");

      if (!content.trim()) {
        alert("Please enter some text!");
        return;
      }

      const response = await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      });

      const data = await response.json();
      if (data.success) {
        result.innerText = "Your ID: " + data.clip_id;
        result.classList.remove("opacity-0");
      } else {
        alert("Failed to save text.");
      }
    }
  </script>
</body>
