<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retrieve Clipboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between">
      <a href="/" class="text-xl font-bold">Online Clipboard</a>
      <div>
        <a href="/get" class="px-4">Retrieve</a>
        <a href="/about" class="px-4">About</a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="flex justify-center items-center h-screen">
      <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-xl font-bold mb-4">Retrieve Clipboard Content</h2>
        <input
          id="clipId"
          type="text"
          placeholder="Enter ID"
          class="w-full p-2 border rounded"
        />
        <button
          onclick="getClipboard()"
          class="w-full mt-3 bg-blue-500 text-white py-2 rounded hover:bg-blue-700"
        >
          Get Data
        </button>
        <div id="outputContainer" class="hidden mt-4 p-4 bg-gray-200 rounded">
          <p id="output" class="text-gray-700"></p>
          <button
            onclick="copyToClipboard()"
            class="mt-2 bg-green-500 text-white px-3 py-1 rounded"
          >
            Copy
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center p-4 mt-6 bg-gray-800 text-white">
      <p>
        Follow me:
        <a
          href="https://github.com/your-github"
          target="_blank"
          class="text-blue-400"
          >GitHub</a
        >
        |
        <a
          href="https://linkedin.com/in/your-profile"
          target="_blank"
          class="text-blue-400"
          >LinkedIn</a
        >
      </p>
    </footer>

    <script>
      async function getClipboard() {
        const clipId = document.getElementById("clipId").value;
        if (!clipId) {
          alert("Please enter an ID!");
          return;
        }
        const response = await fetch(`/get/${clipId}`);
        const data = await response.json();
        if (data.success) {
          document.getElementById("output").innerText = data.content;
          document.getElementById("outputContainer").classList.remove("hidden");
        } else {
          alert("Clipboard content not found!");
        }
      }

      function copyToClipboard() {
        const text = document.getElementById("output").innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert("Copied to clipboard!");
        });
      }
    </script>
  </body>
</html>
