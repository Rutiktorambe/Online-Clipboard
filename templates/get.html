{% include 'navbar.html' %}
<body
  class="bg-gray-100 dark:bg-gray-900 flex flex-col justify-center items-center min-h-screen mt-16"
>
  <div
    class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md mt-10"
  >
    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-4">
      Retrieve Clipboard Content
    </h2>

    <input
      id="clipId"
      type="text"
      placeholder="Enter ID"
      class="w-full p-3 border rounded-lg bg-gray-100 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500"
    />

    <button
      onclick="getClipboard()"
      class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition-all duration-300"
    >
      Get Data
    </button>

    <div
      id="outputSection"
      class="hidden mt-4 p-4 bg-gray-200 dark:bg-gray-700 rounded-lg transition-opacity duration-300"
    >
      <p id="outputText" class="text-gray-900 dark:text-white break-words"></p>
      <button
        onclick="copyText()"
        class="mt-3 bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg font-medium transition-all duration-300"
      >
        Copy
      </button>
    </div>
  </div>

  {% include 'footer.html' %}

  <script>
    async function getClipboard() {
      const clipId = document.getElementById("clipId").value;
      const outputSection = document.getElementById("outputSection");
      const outputText = document.getElementById("outputText");

      if (!clipId.trim()) {
        alert("Please enter an ID!");
        return;
      }

      const response = await fetch(`/get/${clipId}`);
      const data = await response.json();

      if (data.success) {
        outputText.innerText = data.content;
        outputSection.classList.remove("hidden");
      } else {
        alert("Clipboard content not found!");
      }
    }

    function copyText() {
      const text = document.getElementById("outputText").innerText;
      navigator.clipboard.writeText(text);
      alert("Copied to clipboard!");
    }
  </script>
</body>
